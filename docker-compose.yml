# =============================================================================
#  Weather Lakehouse – Iceberg + Airflow (Python + Spark) + Trino + Superset
#  Chạy:  docker compose up -d --build
# =============================================================================
name: weather-lakehouse

x-lakehouse-env: &lakehouse-env
  ICEBERG_REST_URI: http://iceberg-rest:8181
  ICEBERG_WAREHOUSE: ${WAREHOUSE}
  S3_ENDPOINT: http://minio:9000
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  AWS_REGION: ${AWS_REGION}

x-airflow-common: &airflow-common
  image: weather-lakehouse/airflow:2.10.5
  environment:
    <<: *lakehouse-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    PYTHONPATH: /opt/airflow
    SPARK_MASTER_URL: spark://spark-master:7077
    SPARK_DRIVER_HOST: airflow-scheduler
    SUPERSET_URL: http://superset:8088
    SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
    SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    BACKFILL_START_DATE: ${BACKFILL_START_DATE}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/pipeline
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    iceberg-rest:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- Storage
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  minio:
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: warehouse
    ports:
      - "${MINIO_API_PORT:-9100}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9101}:9001"   # MinIO Console
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  iceberg-rest:
    build: ./docker/iceberg-rest
    image: weather-lakehouse/iceberg-rest:1.9.2
    environment:
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg_catalog
      CATALOG_JDBC_USER: ${POSTGRES_USER}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
      CATALOG_WAREHOUSE: ${WAREHOUSE}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: ${AWS_REGION}
    ports:
      - "${ICEBERG_REST_PORT:-8181}:8181"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8181/v1/config || exit 1"]
      interval: 5s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped

  # ---------------------------------------------------------------- Compute
  spark-master:
    build: ./docker/spark
    image: weather-lakehouse/spark:3.5.6-iceberg
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      <<: *lakehouse-env
      SPARK_MASTER_HOST: spark-master
    ports:
      - "${SPARK_UI_PORT:-8090}:8080"   # Spark Master UI
    mem_limit: 768m
    restart: unless-stopped

  spark-worker:
    image: weather-lakehouse/spark:3.5.6-iceberg
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      <<: *lakehouse-env
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      - spark-master
    mem_limit: 2560m
    restart: unless-stopped

  # ---------------------------------------------------------------- Orchestration
  airflow-init:
    <<: *airflow-common
    build: ./docker/airflow   # chỉ build 1 lần, webserver/scheduler dùng lại image này
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create --role Admin --username "${AIRFLOW_ADMIN_USER}" --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname Lakehouse --email admin@example.com || true
        airflow pools set open_meteo_api 1 "Open-Meteo (ERA5, Historical Forecast, Air Quality): chung han muc, tuan tu"
        airflow pools set spark_cluster 1 "Moi luc 1 job Spark"
        airflow pools delete nasa_power_api || true
        airflow pools delete iem_asos_api || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8082}:8080"
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 15s
      retries: 20
    mem_limit: 1g
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    hostname: airflow-scheduler   # Spark executor kết nối ngược về driver qua tên này
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    mem_limit: 2560m
    restart: unless-stopped

  # ---------------------------------------------------------------- Serving
  trino:
    image: trinodb/trino:476
    environment:
      AWS_REGION: ${AWS_REGION}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${TRINO_PORT:-8083}:8080"
    volumes:
      - ./trino/etc/catalog:/etc/trino/catalog:ro
      - ./trino/etc/jvm.config:/etc/trino/jvm.config:ro
    depends_on:
      iceberg-rest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/v1/info"]
      interval: 10s
      retries: 30
    mem_limit: 2g
    restart: unless-stopped

  superset:
    build: ./docker/superset
    image: weather-lakehouse/superset:4.1.2
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      GUNICORN_TIMEOUT: "300"
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    depends_on:
      postgres:
        condition: service_healthy
      trino:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8088/health"]
      interval: 15s
      retries: 30
    mem_limit: 1536m
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  airflow-logs:
